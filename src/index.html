<style>/* ひらめき書斎: 罫線入りの原稿用紙と藍インク、朱の判子。見出しは明朝、数字は等幅 */
:root{
  --bg:#f4efe4; --paper:#fbf8f1; --ink:#1f2a3a; --muted:#6b6457; --soft:#efe8d8;
  --line:#1f2a3a; --shadow:rgba(31,42,58,.18); --bw:1.5px; --on-gc:#1f2a3a;
  --accent:#c4452f; --ok:#3f7d58; --ng:#c4452f;
  --pat:repeating-linear-gradient(0deg,transparent 0 31px,rgba(31,42,58,.06) 31px 32px); --pat-size:auto;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --r:10px; color-scheme:light;
}

/* 共通エンジンの見た目。色・書体・線の太さは各アプリの theme.css が :root で決める */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);background-image:var(--pat);background-size:var(--pat-size);
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-inline:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ホーム */
.hero{display:flex;flex-direction:column;gap:6px;padding:4px 4px 2px}
.hero .tag{align-self:flex-start;background:var(--ink);color:var(--paper);font-weight:800;font-size:12px;letter-spacing:.08em;padding:2px 12px;border-radius:999px}
.hero h1{font-size:clamp(40px,13vw,60px);letter-spacing:.02em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-weight:700;font-size:14px}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:480px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{cursor:pointer;text-align:left;background:var(--paper);border:var(--bw) solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);
  padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .08s,box-shadow .08s}
.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.badge{width:100%;aspect-ratio:1.6;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;
  font-family:var(--f-display);font-size:clamp(30px,9vw,44px);color:var(--on-gc);position:relative;overflow:hidden}
.badge small{position:absolute;top:6px;left:8px;font-family:var(--f-body);font-weight:800;font-size:11px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:0 7px;line-height:1.6}
.card b{font-weight:800;font-size:15px;line-height:1.3}
.card .best{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.foot{font-size:12px;color:var(--muted);text-align:center}

/* プレイ画面 */
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.ib{cursor:pointer;background:var(--paper);border:var(--bw) solid var(--line);border-radius:999px;box-shadow:2px 2px 0 var(--shadow);font-weight:800;font-size:14px;padding:5px 12px;white-space:nowrap}
.bar h2{font-size:20px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 4px;min-height:1.6em}
.hud b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1}
#stage-wrap{position:relative;border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:4px 4px 0 var(--shadow);background:var(--paper);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;width:100%;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
.shake{animation:shake .28s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;
  background:color-mix(in srgb,var(--paper) 93%,transparent);z-index:5}
.ov h2{font-size:30px}
.ov .how{font-weight:700;max-width:30ch;color:var(--muted)}
.ov .score{font-family:var(--f-display);font-size:clamp(52px,17vw,84px);line-height:1;font-variant-numeric:tabular-nums}
.ov .rank{font-family:var(--f-display);font-size:22px;color:var(--on-gc);background:var(--gc,#ffcf4a);border:var(--bw) solid var(--line);border-radius:999px;padding:4px 18px;box-shadow:3px 3px 0 var(--shadow)}
.ov .newbest{font-weight:800;color:var(--paper);background:var(--accent);border-radius:999px;padding:2px 12px;font-size:13px;letter-spacing:.06em}
.ov .sub{font-weight:700;color:var(--muted);font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{cursor:pointer;font-weight:800;font-size:17px;background:var(--gc,#ffcf4a);border:var(--bw) solid var(--line);border-radius:999px;padding:11px 26px;box-shadow:3px 3px 0 var(--shadow);text-decoration:none;color:var(--on-gc);display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.sub{background:var(--paper);color:var(--ink);font-size:15px;padding:9px 18px}
.btn.dark{background:var(--ink);color:var(--paper)}
.next{font-size:13px;font-weight:700;color:var(--muted)}
.next button{cursor:pointer;background:none;border:0;padding:0;font-weight:800;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.langs a{color:var(--muted);font-size:13px;font-weight:700;padding:4px 8px}

/* シェア */
.sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--paper);border:var(--bw) solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet img{width:100%;border:2px solid var(--line);border-radius:12px}
.sheet .note{font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-weight:800;padding:8px 16px;border-radius:999px;z-index:60;font-size:14px}

/* ゲーム内で使う共通パーツ */
.pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:34px;pointer-events:none;white-space:nowrap;
  color:var(--ink);text-shadow:2px 2px 0 var(--paper),-2px -2px 0 var(--paper),2px -2px 0 var(--paper),-2px 2px 0 var(--paper);animation:pop .7s ease-out forwards;z-index:4}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100% - 24px),calc(var(--sh,400px) - 24px));aspect-ratio:1;display:grid;gap:8px}
.cell{cursor:pointer;border:var(--bw) solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center;
  font-family:var(--f-display);font-size:clamp(18px,6vw,30px);min-width:0;min-height:0;padding:0;box-shadow:2px 2px 0 var(--shadow);transition:transform .06s,background .12s}
.cell:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.big{font-family:var(--f-display);font-size:clamp(44px,15vw,72px);line-height:1.05;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.choice{cursor:pointer;border:var(--bw) solid var(--line);border-radius:16px;box-shadow:3px 3px 0 var(--shadow);background:var(--paper);
  font-family:var(--f-display);font-size:clamp(22px,7vw,34px);padding:18px 8px;min-width:0}
.choice:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hint{font-weight:700;color:var(--muted)}

/* プレイ中は画面いっぱい */
#play{position:fixed;inset:0;z-index:10;max-width:none;display:flex;flex-direction:column;gap:6px;
  background-color:var(--bg);background-image:var(--pat);background-size:var(--pat-size);
  padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px))}
#play>*{width:100%;max-width:640px;margin-inline:auto}
#play .bar h2{font-size:18px}
#play .hud{min-height:1.5em}
body.playing{overflow:hidden;overscroll-behavior:none}

h1,h2,h3{font-weight:800}
.hero h1{font-size:clamp(40px,12vw,56px);letter-spacing:.04em}
.hero .tag{background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:4px}
.card{border-radius:8px}
.badge{border-radius:6px;aspect-ratio:1.5;font-weight:800}
.badge small{border-radius:3px;font-family:"IBM Plex Mono",monospace}
.btn,.ib{border-radius:6px}
.ov .rank{border-radius:6px}
.ov .score,.hud b,.big{font-family:"IBM Plex Mono",monospace;font-weight:600;letter-spacing:-.02em}
.cell{border-radius:6px;font-family:"IBM Plex Mono",monospace;font-weight:600}
.choice{border-radius:8px}
.ov .newbest{border-radius:4px}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.on-portal .foot{display:none}
.langs{text-align:center;margin:0}
.langs button{cursor:pointer;background:none;border:0;padding:4px 8px;color:var(--muted);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
</style>

</head>
<body>
<div class="wrap">
  <section id="hub" class="wrap" style="max-width:none">
    <header class="hero">
      <span class="tag">1日5分・大人の頭の体操</span>
      <h1>ひらめき<span>書斎</span></h1>
      <p>テンパズル、数列、ナンプレ、論理推理。すきま時間に解ける、ちょっと手ごわい知的ゲーム10本。</p>
    </header>
    <div class="shelf" id="shelf"></div>
    <p class="foot">記録はこの端末のブラウザにだけ保存されます</p>
    <p class="langs"><button type="button" id="lang">English</button><!--PRIVACY-LINK--></p>
  </section>

  <section id="play" hidden>
    <div class="bar">
      <button class="ib" type="button" id="back">‹ ホーム</button>
      <h2 id="g-title"></h2>
      <button class="ib" type="button" id="mute" aria-pressed="true">音オン</button>
    </div>
    <div class="hud" aria-live="polite"><span id="hud-l"></span><span id="hud-r"></span></div>
    <div id="stage-wrap">
      <div id="stage"></div>
      <div class="ov" id="ov" hidden></div>
    </div>
  </section>
</div>

<script>
(window.PLATFORM && window.PLATFORM.init ? window.PLATFORM.init() : Promise.resolve()).then(() => {
/* 言語: ?lang=en / 前回の選択 / ブラウザの言語 の順で決める。日本語以外は英語 */
const LANG = (() => {
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) return q === "ja" ? "ja" : "en"; } catch (e) {}
  try { const s = localStorage.getItem("lang"); if (s) return s; } catch (e) {}
  if (window.PLATFORM && window.PLATFORM.lang) return window.PLATFORM.lang;
  return /^ja\b/i.test(navigator.language || "") ? "ja" : "en";
})();
const EN = LANG !== "ja";
const tr = (ja, en) => EN ? en : ja;
/* HTMLに直接書いてある文字の英語版と、言語の切り替え */
(() => {
  const q = sel => document.querySelector(sel);
  if (EN) {
    document.documentElement.lang = "en";
    q(".hero .tag").textContent = "5 minutes a day · Brain workout for adults";
    q(".hero h1").innerHTML = "Hirameki <span>Study</span>";
    q(".hero p").textContent = "Make 10, number sequences, sudoku, logic puzzles. 10 tricky brain games for your spare moments.";
    q(".foot").textContent = "Your records are saved only in this browser";
    q("#back").textContent = "‹ Home";
  }
  const btn = q("#lang");
  btn.textContent = EN ? "日本語" : "English";
  btn.onclick = () => {
    const next = EN ? "ja" : "en";
    try { localStorage.setItem("lang", next); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set("lang", next); location.replace(u.href);
  };
})();
const BRAND = {
  name: tr("ひらめき書斎", "Hirameki Study"), title: tr("ひらめき書斎｜1問で頭が冴える知的ゲーム10", "Hirameki Study | 10 Brain Puzzles to Sharpen Your Mind"), hashtag: tr("ひらめき書斎", "HiramekiStudy"), slug: "shosai", prefix: "hs-",
  fd: '"Shippori Mincho B1","Hiragino Mincho ProN",serif', fb: '"Zen Kaku Gothic New","Hiragino Sans",sans-serif',
  c: { bg: "#fbf8f1", ink: "#1f2a3a", muted: "#6b6457", line: "#1f2a3a", accent: "#c4452f", soft: "#efe8d8" },
  card: { bg: "#f4efe4", dot: "rgba(31,42,58,.07)", panel: "#fbf8f1", ink: "#1f2a3a", muted: "#6b6457", foot: "#c4452f", shadow: "rgba(31,42,58,.15)", font: '"Shippori Mincho B1","Hiragino Mincho ProN",serif' },
};

/* 共通ゲームエンジン（BRANDで名前・色を差し替え）: ゲーム登録、プレイ画面、スコア保存、結果画像、効果音 */
const $ = (s, r = document) => r.querySelector(s);
const GAMES = [];
const game = def => GAMES.push(def);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PF = window.PLATFORM || {};
const _ls = () => PF.storage || localStorage;
const store = (k, v) => { try { if (v === undefined) return JSON.parse(_ls().getItem(k) || "null"); _ls().setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
const adGate = fn => PF.midgame ? PF.midgame(fn) : fn();
const track = (name, params) => { try { PF.track && PF.track(name, params); } catch (e) {} };

/* ---------- 効果音 ---------- */
let AC = null, muted = !!store(BRAND.prefix + "mute");
function beep(freq = 660, dur = 0.08, type = "sine", vol = 0.12) {
  if (muted || PF.adPlaying) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  ok: (n = 0) => beep(523 * Math.pow(2, Math.min(n, 24) / 12), 0.09, "triangle"),
  ng: () => beep(150, 0.18, "square", 0.08),
  tick: () => beep(900, 0.03, "sine", 0.06),
  over: () => { beep(330, 0.12, "triangle"); setTimeout(() => beep(220, 0.25, "triangle"), 120); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.12, "triangle"), i * 90)),
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

function toast(msg) {
  let t = $(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2000);
}

/* ---------- ベスト記録 ---------- */
const bestOf = g => store(BRAND.prefix + "best-" + g.id);
function saveBest(g, s) {
  const b = bestOf(g);
  const better = b === null || (g.lower ? s < b : s > b);
  if (better) store(BRAND.prefix + "best-" + g.id, s);
  return better;
}
const rankOf = (g, s) => (g.lower ? g.ranks.find(r => s <= r[0]) : g.ranks.find(r => s >= r[0])) || g.ranks[g.ranks.length - 1];

/* ---------- ホーム ---------- */
function renderHub() {
  $("#shelf").innerHTML = GAMES.map((g, i) => {
    const b = bestOf(g);
    return tr(`<button class="card" type="button" data-g="${g.id}">
      <span class="badge" style="background:${g.color}"><small>${String(i + 1).padStart(2, "0")}</small>${g.glyph}</span>
      <b>${esc(g.name)}</b><span class="best">${b === null ? "まだ遊んでない" : "ベスト " + esc(g.fmt(b))}</span></button>`, `<button class="card" type="button" data-g="${g.id}">
      <span class="badge" style="background:${g.color}"><small>${String(i + 1).padStart(2, "0")}</small>${g.glyph}</span>
      <b>${esc(g.name)}</b><span class="best">${b === null ? "Not played yet" : "Best " + esc(g.fmt(b))}</span></button>`);
  }).join("");
}
$("#shelf").addEventListener("click", e => { const c = e.target.closest("[data-g]"); if (c) go(c.dataset.g); });

/* ---------- プレイ画面 ---------- */
let cur = null, ctx = null;
function stageSize() {
  const st = $("#stage");
  st.style.setProperty("--sh", (st.clientHeight || 500) + "px");
}
function go(id) {
  const g = GAMES.find(x => x.id === id);
  if (!g) { home(); return; }
  cur = g; if (ctx) ctx.kill();
  try { if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); } catch (e) {}
  $("#hub").hidden = true; $("#play").hidden = false; document.body.classList.add("playing");
  document.documentElement.style.setProperty("--gc", g.color);
  $("#g-title").textContent = g.name; document.title = g.name + tr("｜", " | ") + BRAND.name;
  $("#stage").innerHTML = ""; hud("", ""); stageSize();
  const b = bestOf(g);
  const ov = $("#ov");
  ov.innerHTML = tr(`<h2>${esc(g.name)}</h2><p class="how">${g.how}</p>
    ${b === null ? "" : `<p class="sub">ベスト ${esc(g.fmt(b))}</p>`}
    <button class="btn" type="button" id="start">スタート</button>`, `<h2>${esc(g.name)}</h2><p class="how">${g.how}</p>
    ${b === null ? "" : `<p class="sub">Best ${esc(g.fmt(b))}</p>`}
    <button class="btn" type="button" id="start">Start</button>`);
  ov.hidden = false; $("#start").onclick = start; $("#start").focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
function home() {
  if (ctx) ctx.kill(); ctx = null; cur = null;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  document.title = BRAND.title;
  $("#play").hidden = true; $("#hub").hidden = false; document.body.classList.remove("playing"); renderHub();
}
function hud(l, r) { $("#hud-l").innerHTML = l; $("#hud-r").innerHTML = r; }

function start() {
  if (ctx) ctx.kill();
  const g = cur, stage = $("#stage");
  stage.innerHTML = ""; $("#ov").hidden = true; stageSize();
  beep(1, 0.001, "sine", 0.0001); // 音を使えるようにする
  if (PF.gameplayStart) PF.gameplayStart();
  track("game_start", { game: g.id });
  const subs = [];
  let alive = true, ended = false;
  ctx = {
    stage, W: stage.clientWidth, H: stage.clientHeight, g,
    on(el, ev, fn, opt) { el.addEventListener(ev, fn, opt); subs.push(() => el.removeEventListener(ev, fn, opt)); },
    after(ms, fn) { const t = setTimeout(() => alive && fn(), ms); subs.push(() => clearTimeout(t)); return t; },
    every(ms, fn) { const t = setInterval(() => alive && fn(), ms); subs.push(() => clearInterval(t)); return t; },
    loop(fn) {
      let last = performance.now(), id = 0;
      const step = now => { if (!alive) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; if (fn(dt, now) !== false) id = requestAnimationFrame(step); };
      id = requestAnimationFrame(step); subs.push(() => cancelAnimationFrame(id));
    },
    canvas() {
      const c = document.createElement("canvas"), dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = Math.round(ctx.W * dpr); c.height = Math.round(ctx.H * dpr);
      stage.appendChild(c); const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { c, x, W: ctx.W, H: ctx.H };
    },
    el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); const e = d.firstElementChild; stage.appendChild(e); return e; },
    hud, sfx, buzz,
    pop(text, color) { const p = document.createElement("div"); p.className = "pop"; p.textContent = text; if (color) p.style.color = color; stage.appendChild(p); setTimeout(() => p.remove(), 750); },
    shake() { const w = $("#stage-wrap"); w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake"); buzz(30); },
    /* 秒数タイマー。penalty(秒)で減らせる。0になったら done() */
    timer(sec, done) {
      let left = sec, last = performance.now();
      const t = { get left() { return left; }, penalty(s) { left = Math.max(0, left - s); }, bonus(s) { left += s; } };
      ctx.loop(() => { const now = performance.now(); left -= (now - last) / 1000; last = now;
        if (left <= 0) { left = 0; t.onTick && t.onTick(0); done(); return false; } t.onTick && t.onTick(left); });
      return t;
    },
    end(score) {
      if (ended) return; ended = true; alive = false; subs.forEach(f => f()); subs.length = 0;
      if (PF.gameplayStop) PF.gameplayStop();
      setTimeout(() => finish(g, score), 450);
    },
    kill() { if (alive && PF.gameplayStop) PF.gameplayStop(); alive = false; ended = true; subs.forEach(f => f()); subs.length = 0; },
    get alive() { return alive; },
  };
  g.play(ctx);
}

function finish(g, score) {
  const prevBest = bestOf(g);
  const isBest = saveBest(g, score);
  if (isBest && prevBest !== null && PF.happy) PF.happy();
  track("game_end", { game: g.id, score });
  const [, rank] = rankOf(g, score);
  const b = bestOf(g);
  isBest ? sfx.win() : sfx.over();
  const others = GAMES.filter(x => x.id !== g.id), nx = pick(others);
  const ov = $("#ov");
  ov.innerHTML = tr(`${isBest ? `<span class="newbest">ベスト更新！</span>` : ""}
    <div class="score">${esc(g.fmt(score))}</div>
    <div class="rank">${esc(rank)}</div>
    <p class="sub">ベスト ${esc(g.fmt(b))}</p>
    <div class="btns"><button class="btn" type="button" id="again">もう一回</button>
      ${PF.noShare ? "" : `<button class="btn sub" type="button" id="share">画像でシェア</button>`}</div>
    <p class="next">次はこれ → <button type="button" id="nx">${esc(nx.name)}</button></p>`, `${isBest ? `<span class="newbest">NEW BEST!</span>` : ""}
    <div class="score">${esc(g.fmt(score))}</div>
    <div class="rank">${esc(rank)}</div>
    <p class="sub">Best ${esc(g.fmt(b))}</p>
    <div class="btns"><button class="btn" type="button" id="again">Play again</button>
      ${PF.noShare ? "" : `<button class="btn sub" type="button" id="share">Share image</button>`}</div>
    <p class="next">Try next → <button type="button" id="nx">${esc(nx.name)}</button></p>`);
  ov.hidden = false;
  $("#again").onclick = () => adGate(start); $("#again").focus({ preventScroll: true });
  if ($("#share")) $("#share").onclick = () => share(g, score, rank, isBest);
  $("#nx").onclick = () => adGate(() => go(nx.id));
}

  x.textAlign = "center"; x.textBaseline = "alphabetic";
  x.fillStyle = K.ink; rr(x, 340, 100, 400, 96, 48); x.fill(); x.fillStyle = K.panel; fit(x, BRAND.name, 340, 50, FDc); x.fillText(BRAND.name, 540, 166);
  x.fillStyle = K.ink; fit(x, g.name, 780, 80, FDc); x.fillText(g.name, 540, 330);

function stopwatch(c, left = () => "") {
  const t0 = performance.now(); let pen = 0;
  const w = { get t() { return (performance.now() - t0) / 1000 + pen; }, add(s) { pen += s; } };

}

/* ---------- 01 テンパズル ---------- */
function solve10(nums) {
  const E = 1e-9;
  const rec = a => {
    if (a.length === 1) return Math.abs(a[0] - 10) < E;
    for (let i = 0; i < a.length; i++) for (let j = 0; j < a.length; j++) {
      if (i === j) continue;
      const rest = a.filter((_, k) => k !== i && k !== j), x = a[i], y = a[j];
      const cands = [x + y, x - y, x * y]; if (Math.abs(y) > E) cands.push(x / y);
      for (const v of cands) if (rec([...rest, v])) return true;
    }
    return false;
  };
  return rec(nums);
}

  play(c) {

    const box = panel(c, tr(`
      <div style="display:flex;gap:10px;justify-content:center" data-nums></div>

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%">
        ${btnRow([["+", "＋"], ["-", "−"], ["*", "×"], ["/", "÷"], ["(", "("], [")", ")"], ["back", "1字消す", "font-size:15px"], ["clear", "全部消す", "font-size:15px"]], "choice")}
      </div>
      <div style="display:flex;gap:10px;width:100%"><button class="btn" type="button" data-v="check" style="flex:1;justify-content:center">判定</button><button class="btn sub" type="button" data-v="pass">パス</button></div>`, `
      <div style="display:flex;gap:10px;justify-content:center" data-nums></div>
      <div data-ex style="min-height:56px;width:100%;border-bottom:1.5px solid ${SC.ink};font-family:${MONO};font-size:clamp(24px,8vw,34px);display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap"></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%">
        ${btnRow([["+", "＋"], ["-", "−"], ["*", "×"], ["/", "÷"], ["(", "("], [")", ")"], ["back", "Undo", "font-size:15px"], ["clear", "Clear", "font-size:15px"]], "choice")}
      </div>
      <div style="display:flex;gap:10px;width:100%"><button class="btn" type="button" data-v="check" style="flex:1;justify-content:center">Check</button><button class="btn sub" type="button" data-v="pass">Pass</button></div>`));
    box.querySelectorAll(".choice").forEach(b => { b.style.padding = "10px 4px"; b.style.fontSize = b.style.fontSize || "24px"; });

      EX.textContent = expr.map(t => t.s).join(" ") || " ";
    }
    const t = timed(c, 120, tr("問", " solved"), () => score);

      const v = b.dataset.v;
      if (v === "back") { const last = expr.pop(); if (last && last.i !== undefined) used[last.i] = false; draw(); }

    });
    newQ();
  },
});

/* ---------- 02 数列 ---------- */
game({
  id: "seq", name: tr("数列のつづき", "Number Sequence"), glyph: "列", color: "#a8c5da",
  how: tr("並んだ数の法則を見抜いて、？に入る数を選ぼう。まちがえると5秒マイナス。90秒。", "Find the rule of the sequence and choose the number that replaces the ?. A wrong answer costs 5 seconds. 90 seconds."),
  fmt: s => s + tr("問", " solved"),
  ranks: [[22, tr("法則ハンター", "Pattern hunter")], [16, tr("論理派", "Logical mind")], [12, tr("鋭い", "Sharp")], [8, tr("いい調子", "Doing well")], [4, tr("ふつう", "Average")], [0, tr("直感派", "Intuitive")]],
  play(c) {
    let score = 0, ans = 0;
    const box = panel(c, tr(`<p class="hint">？に入る数は？</p>
      <div data-q style="font-family:${MONO};font-size:clamp(22px,7vw,32px);font-weight:600;line-height:1.5"></div>
      <div class="row2" data-opts></div>`, `<p class="hint">Which number replaces the ?</p>
      <div data-q style="font-family:${MONO};font-size:clamp(22px,7vw,32px);font-weight:600;line-height:1.5"></div>
      <div class="row2" data-opts></div>`));
    const Q = box.querySelector("[data-q]"), O = box.querySelector("[data-opts]");
    function make() {
      const lv = score, types = lv < 4 ? ["ar", "geo", "ar"] : lv < 9 ? ["ar", "geo", "diff", "sq", "fib"] : ["diff", "sq", "fib", "alt", "lin", "geo", "cube"];
      const ty = pick(types); let s = [];
      if (ty === "ar") { const a = ri(1, 30), d = pick([-7, -5, -4, -3, 2, 3, 4, 5, 6, 7, 9, 11]); for (let k = 0; k < 6; k++) s.push(a + d * k); }
      if (ty === "geo") { const a = ri(1, 5), r = pick([2, 3]); for (let k = 0; k < 6; k++) s.push(a * r ** k); }
      if (ty === "diff") { let a = ri(1, 10), d = ri(1, 3); const inc = ri(1, 3); for (let k = 0; k < 6; k++) { s.push(a); a += d; d += inc; } }
      if (ty === "sq") { const o = ri(-3, 5), st = ri(1, 4); for (let k = 0; k < 6; k++) s.push((st + k) ** 2 + o); }
      if (ty === "cube") { const st = ri(1, 2); for (let k = 0; k < 6; k++) s.push((st + k) ** 3); }
      if (ty === "fib") { let a = ri(1, 4), b = ri(2, 6); for (let k = 0; k < 6; k++) { s.push(a); [a, b] = [b, a + b]; } }
      if (ty === "alt") { const a = ri(1, 9), b = ri(20, 40), d1 = ri(2, 5), d2 = -ri(1, 4); for (let k = 0; k < 6; k++) s.push(k % 2 ? b + d2 * (k >> 1) : a + d1 * (k >> 1)); }
      if (ty === "lin") { let a = ri(1, 4); const m = pick([2, 3]), p = pick([-1, 1, 2]); for (let k = 0; k < 6; k++) { s.push(a); a = a * m + p; } }
      ans = s[5];
      const opts = new Set([ans]);
      const near = [ans + 1, ans - 1, ans + 2, ans - 2, s[4] + (s[4] - s[3]), ans + (s[1] - s[0]), ans * 2, ans + 10, ans - 10].filter(v => v !== ans);
      while (opts.size < 4) opts.add(near.length ? near.splice(ri(0, near.length - 1), 1)[0] : ans + ri(3, 20));
      Q.textContent = s.slice(0, 5).join(",  ") + tr(",  ？", ",  ?");
      O.innerHTML = btnRow(shuffle([...opts]).map(v => [v, v, `font-family:${MONO}`]));
    }
    const t = timed(c, 90, tr("問", " solved"), () => score);
    c.on(O, "pointerdown", e => {
      const b = e.target.closest("[data-v]"); if (!b) return; e.preventDefault();
      if (+b.dataset.v === ans) { score++; c.sfx.ok(score % 12); } else { t.penalty(5); c.sfx.ng(); c.shake(); c.pop(tr(`正解は ${ans}`, `Answer: ${ans}`), SC.accent); }
      make();
    });
    make();
  },
});

game({
  id: "sudoku", name: tr("ナンプレ6×6", "Sudoku 6×6"), glyph: "六", color: "#b7c9a8", lower: true,
  how: tr("どの行・列・太枠（2×3）にも1〜6が1つずつ入るように埋めよう。まちがえると5秒プラス。", "Fill the grid so every row, column and bold box (2×3) has 1–6 exactly once. A wrong entry adds 5 seconds."),
  fmt: sec,
  ranks: [[90, tr("パズル職人", "Puzzle artisan")], [150, tr("かなり速い", "Very fast")], [220, tr("いい調子", "Doing well")], [320, tr("ふつう", "Average")], [480, tr("じっくり派", "Takes it slow")], [99999, tr("ゆったり派", "Relaxed")]],
  play(c) {
    const N = 6, BR = 2, BC = 3;
    const ok = (g, r, k, v) => { for (let i = 0; i < N; i++) if (g[r * N + i] === v || g[i * N + k] === v) return false; const r0 = r - r % BR, c0 = k - k % BC; for (let i = 0; i < BR; i++) for (let j = 0; j < BC; j++) if (g[(r0 + i) * N + c0 + j] === v) return false; return true; };
    const fill = g => { const i = g.indexOf(0); if (i < 0) return true; for (const v of shuffle([1, 2, 3, 4, 5, 6])) if (ok(g, Math.floor(i / N), i % N, v)) { g[i] = v; if (fill(g)) return true; g[i] = 0; } return false; };
    const count = (g, lim = 2) => { const i = g.indexOf(0); if (i < 0) return 1; let n = 0; for (let v = 1; v <= N && n < lim; v++) if (ok(g, Math.floor(i / N), i % N, v)) { g[i] = v; n += count(g, lim - n); g[i] = 0; } return n; };
    const sol = Array(36).fill(0); fill(sol);
    const puz = sol.slice();
    for (const i of shuffle([...Array(36).keys()])) { const b = puz[i]; puz[i] = 0; if (count(puz.slice()) !== 1) puz[i] = b; if (puz.filter(v => !v).length >= 20) break; }
    const given = puz.map(v => v > 0); let sel = puz.indexOf(0);
    const box = panel(c, `<div class="grid" data-g style="position:relative;left:auto;top:auto;transform:none;width:min(100%,calc(var(--sh) - 150px));grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:0;border:2.5px solid ${SC.ink}"></div>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%">${btnRow([1, 2, 3, 4, 5, 6].map(n => [n, n, `padding:12px 0;font-family:${MONO}`]))}</div>`);
    const G = box.querySelector("[data-g]");
    const w = stopwatch(c, () => tr(`のこり <b>${puz.filter(v => !v).length}</b> マス`, `<b>${puz.filter(v => !v).length}</b> cells left`));
    function draw() {
      G.innerHTML = puz.map((v, i) => {
        const r = Math.floor(i / N), k = i % N;
        const bd = `border-right:${k % BC === BC - 1 && k < N - 1 ? 2.5 : .75}px solid ${SC.ink};border-bottom:${r % BR === BR - 1 && r < N - 1 ? 2.5 : .75}px solid ${SC.ink};`;
        return `<button type="button" data-i="${i}" style="all:unset;cursor:pointer;display:grid;place-items:center;${bd}font-family:${MONO};font-size:clamp(18px,6vw,28px);font-weight:${given[i] ? 600 : 500};color:${given[i] ? SC.ink : "#2f6db0"};background:${i === sel ? "#f3dfa2" : given[i] ? SC.soft : "transparent"}">${v || ""}</button>`;
      }).join("");
    }
    c.on(G, "pointerdown", e => { const b = e.target.closest("[data-i]"); if (!b) return; e.preventDefault(); const i = +b.dataset.i; if (!given[i]) { sel = i; draw(); } });
    c.on(box, "pointerdown", e => {
      const b = e.target.closest("[data-v]"); if (!b || sel < 0 || given[sel]) return; e.preventDefault();
      const v = +b.dataset.v;
      if (sol[sel] === v) { puz[sel] = v; given[sel] = true; c.sfx.ok(36 - puz.filter(x => !x).length); const nx = puz.indexOf(0); sel = nx; draw(); if (nx < 0) c.end(Math.round(w.t * 10) / 10); }
      else { w.add(5); c.sfx.ng(); c.shake(); c.pop(tr("+5秒", "+5s"), SC.accent); }
    });
    draw();
  },
});

/* ---------- 04 ライツアウト ---------- */
game({
  id: "lights", name: tr("ライツアウト", "Lights Out"), glyph: "灯", color: "#f2b880", lower: true,
  how: tr("マスを押すと、そのマスと上下左右の明かりが反転するよ。全部消そう。3×3→4×4→5×5の3面の合計タイム。", "Tapping a cell flips it and its neighbors above, below, left and right. Turn every light off. Total time over 3×3, 4×4 and 5×5 boards."),
  fmt: sec,
  ranks: [[40, tr("完全攻略", "Fully solved")], [70, tr("ひらめき型", "Flash of insight")], [110, tr("いい調子", "Doing well")], [170, tr("ふつう", "Average")], [260, tr("試行錯誤派", "Trial and error")], [99999, tr("迷宮入り", "Lost in the maze")]],
  play(c) {
    let n = 3, stage = 0, L = [], moves = 0;
    const g = c.el(`<div class="grid"></div>`);
    const w = stopwatch(c, () => tr(`面 <b>${stage + 1}</b>/3　手数 <b>${moves}</b>`, `Board <b>${stage + 1}</b>/3　Moves <b>${moves}</b>`));
    const press = (A, i) => { const r = Math.floor(i / n), k = i % n; [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dk]) => { const rr = r + dr, kk = k + dk; if (rr >= 0 && kk >= 0 && rr < n && kk < n) A[rr * n + kk] ^= 1; }); };
    function level() {
      n = [3, 4, 5][stage]; L = Array(n * n).fill(0); moves = 0;
      const k = [3, 5, 7][stage]; shuffle([...Array(n * n).keys()]).slice(0, k).forEach(i => press(L, i));
      if (L.every(v => !v)) press(L, 0);
      g.style.gridTemplateColumns = `repeat(${n},1fr)`; g.style.gridTemplateRows = `repeat(${n},1fr)`; draw();
    }
    function draw() { g.innerHTML = L.map((v, i) => `<button class="cell" type="button" data-i="${i}" style="background:${v ? "#f2b880" : SC.bg};box-shadow:${v ? "0 0 14px rgba(242,184,128,.9)" : "none"}"></button>`).join(""); }
    c.on(g, "pointerdown", e => {
      const b = e.target.closest("[data-i]"); if (!b) return; e.preventDefault();
      press(L, +b.dataset.i); moves++; c.sfx.tick(); draw();
      if (L.every(v => !v)) { stage++; c.sfx.ok(stage * 4); if (stage >= 3) c.end(Math.round(w.t * 10) / 10); else { c.pop(tr(`${stage}面クリア`, `Board ${stage} cleared`)); c.after(500, level); } }
    });
    level();
  },
});

/* ---------- 05 8パズル ---------- */
game({
  id: "slide", name: tr("8パズル", "8-Puzzle"), glyph: "滑", color: "#c9b6e4", lower: true,
  how: tr("空いたマスに数字をスライドさせて、1〜8の順に並べよう。左上から1,2,3…、右下が空き。", "Slide the tiles into the empty space to put them in order: 1, 2, 3… from the top left, with the bottom right empty."),
  fmt: sec,
  ranks: [[25, tr("スライドの鬼", "Slide demon")], [45, tr("かなり速い", "Very fast")], [70, tr("いい調子", "Doing well")], [110, tr("ふつう", "Average")], [180, tr("じっくり派", "Takes it slow")], [99999, tr("迷い中", "Still wandering")]],
  play(c) {
    let B = [1, 2, 3, 4, 5, 6, 7, 8, 0], moves = 0, last = -1;
    const nb = i => [i - 3, i + 3, i % 3 ? i - 1 : -1, i % 3 < 2 ? i + 1 : -1].filter(j => j >= 0 && j < 9);
    for (let k = 0; k < 80; k++) { const z = B.indexOf(0), opts = nb(z).filter(j => j !== last); const j = pick(opts); last = z; [B[z], B[j]] = [B[j], B[z]]; }
    if (B.join() === "1,2,3,4,5,6,7,8,0") { [B[7], B[8]] = [B[8], B[7]]; [B[6], B[7]] = [B[7], B[6]]; }
    const g = c.el(`<div class="grid" style="grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)"></div>`);
    const w = stopwatch(c, () => tr(`手数 <b>${moves}</b>`, `Moves <b>${moves}</b>`));
    const draw = () => g.innerHTML = B.map((v, i) => v ? `<button class="cell" type="button" data-i="${i}" style="font-size:clamp(28px,10vw,44px);background:${v === i + 1 ? "#e4d8f2" : SC.bg}">${v}</button>` : `<span></span>`).join("");
    c.on(g, "pointerdown", e => {
      const b = e.target.closest("[data-i]"); if (!b) return; e.preventDefault();
      const i = +b.dataset.i, z = B.indexOf(0); if (!nb(z).includes(i)) { c.sfx.ng(); return; }
      [B[z], B[i]] = [B[i], B[z]]; moves++; c.sfx.tick(); draw();
      if (B.join() === "1,2,3,4,5,6,7,8,0") c.end(Math.round(w.t * 10) / 10);
    });
    draw();
  },
});

/* ---------- 06 数字記憶 ---------- */
game({
  id: "span", name: tr("数字の記憶", "Digit Span"), glyph: "憶", color: "#e8a0a0",
  how: tr("表示される数字を覚えて、消えたら同じ順に入力しよう。正解するたび1桁ずつ増える。同じ桁で2回まちがえたら終わり。", "Memorize the digits, then enter them in the same order when they disappear. Each success adds one digit. Two misses at the same length ends the game."),
  fmt: s => s + tr("桁", " digits"),
  ranks: [[12, tr("記憶の怪物", "Memory monster")], [10, tr("写真記憶", "Photographic memory")], [8, tr("かなり強い", "Very strong")], [7, tr("平均以上", "Above average")], [5, tr("ふつう", "Average")], [0, tr("メモ派", "Takes notes")]],
  play(c) {
    let len = 4, best = 0, miss = 0, target = "", input = "", phase = "show";
    const box = panel(c, tr(`<div data-d style="font-family:${MONO};font-size:clamp(30px,10vw,48px);font-weight:600;letter-spacing:.12em;min-height:1.4em;word-break:break-all"></div>
      <p class="hint" data-m></p>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%">${btnRow([1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => [n, n, `padding:12px 0;font-family:${MONO}`]))}</div>
      <div style="display:flex;gap:10px;width:100%"><button class="btn sub" type="button" data-v="bs">1字消す</button><button class="btn" type="button" data-v="ok" style="flex:1;justify-content:center">決定</button></div>`, `<div data-d style="font-family:${MONO};font-size:clamp(30px,10vw,48px);font-weight:600;letter-spacing:.12em;min-height:1.4em;word-break:break-all"></div>
      <p class="hint" data-m></p>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%">${btnRow([1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => [n, n, `padding:12px 0;font-family:${MONO}`]))}</div>
      <div style="display:flex;gap:10px;width:100%"><button class="btn sub" type="button" data-v="bs">Undo</button><button class="btn" type="button" data-v="ok" style="flex:1;justify-content:center">OK</button></div>`));
    const D = box.querySelector("[data-d]"), M = box.querySelector("[data-m]");
    const upd = () => c.hud(tr(`<b>${len}</b> 桁に挑戦`, `<b>${len}</b> digits`), tr(`ミス <b>${miss}</b>/2`, `Misses <b>${miss}</b>/2`));
    function round() {
      target = Array.from({ length: len }, (_, i) => ri(i ? 0 : 1, 9)).join(""); input = ""; phase = "show";
      D.textContent = target; M.textContent = tr("覚えて…", "Memorize…"); upd();
      c.after(900 + len * 450, () => { phase = "input"; D.textContent = tr("・", "・").repeat(len); M.textContent = tr("同じ順に入力", "Enter them in order"); });
    }
    c.on(box, "pointerdown", e => {
      const b = e.target.closest("[data-v]"); if (!b || phase !== "input") return; e.preventDefault();
      const v = b.dataset.v;
      if (v === "bs") input = input.slice(0, -1);
      else if (v === "ok") {
        if (input.length < len) return;
        phase = "judge";
        if (input === target) { best = len; len++; miss = 0; c.sfx.ok(len); M.textContent = tr("正解！", "Correct!"); c.after(700, round); }
        else { miss++; c.sfx.ng(); c.shake(); M.textContent = tr(`正解は ${target}`, `Answer: ${target}`); if (miss >= 2) c.after(1400, () => c.end(best)); else c.after(1400, round); }
        return;
      } else if (input.length < len) { input += v; c.sfx.tick(); }
      D.textContent = (input + tr("・", "・").repeat(len - input.length));
    });
    round();
  },
});

/* ---------- 07 論理推理 ---------- */
game({
  id: "logic", name: tr("順位推理", "Who's First?"), glyph: "推", color: "#9fc2b0",
  how: tr("条件を読んで、質問に合う人を選ぼう。人数と条件はだんだん増えるよ。まちがえると5秒マイナス。90秒。", "Read the clues and pick the person who fits the question. People and clues increase as you go. A wrong answer costs 5 seconds. 90 seconds."),
  fmt: s => s + tr("問", " solved"),
  ranks: [[16, tr("名探偵", "Master detective")], [12, tr("論理の人", "Logician")], [9, tr("鋭い", "Sharp")], [6, tr("いい調子", "Doing well")], [3, tr("ふつう", "Average")], [0, tr("直感派", "Intuitive")]],
  play(c) {
    const NAMES = [tr("佐藤", "Alex"), tr("鈴木", "Ben"), tr("高橋", "Chloe"), tr("田中", "Dan"), tr("伊藤", "Emma"), tr("渡辺", "Finn"), tr("山本", "Grace"), tr("中村", "Hana")];
    const ATTR = [[tr("背が高い", "taller"), tr("背が低い", "shorter"), tr("一番背が高い", "the tallest"), tr("一番背が低い", "the shortest"), tr("2番目に背が高い", "the 2nd tallest")], [tr("年上", "older"), tr("年下", "younger"), tr("一番年上", "the oldest"), tr("一番年下", "the youngest"), tr("2番目に年上", "the 2nd oldest")], [tr("足が速い", "faster"), tr("足が遅い", "slower"), tr("一番足が速い", "the fastest"), tr("一番足が遅い", "the slowest"), tr("2番目に足が速い", "the 2nd fastest")]];
    let score = 0, ans = "";
    const box = panel(c, `<div data-s style="text-align:left;width:100%;font-size:17px;line-height:1.9;font-weight:700"></div>
      <p data-q style="font-family:${BRAND.fd};font-size:22px;font-weight:800"></p>
      <div data-o style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%"></div>`);
    const S = box.querySelector("[data-s]"), Q = box.querySelector("[data-q]"), O = box.querySelector("[data-o]");
    function make() {
      const n = score < 4 ? 3 : score < 9 ? 4 : 5, at = pick(ATTR);
      const ppl = shuffle(NAMES.slice()).slice(0, n); // ppl[0]が最も上
      const facts = [];
      for (let i = 0; i < n - 1; i++) facts.push(Math.random() < .5 ? tr(`${ppl[i]}さんは${ppl[i + 1]}さんより${at[0]}`, `${ppl[i]} is ${at[0]} than ${ppl[i + 1]}`) : tr(`${ppl[i + 1]}さんは${ppl[i]}さんより${at[1]}`, `${ppl[i + 1]} is ${at[1]} than ${ppl[i]}`));
      if (n >= 4 && Math.random() < .6) { const i = ri(0, n - 3), j = ri(i + 2, n - 1); facts.push(tr(`${ppl[i]}さんは${ppl[j]}さんより${at[0]}`, `${ppl[i]} is ${at[0]} than ${ppl[j]}`)); }
      const qk = n >= 4 ? ri(2, 4) : ri(2, 3);
      ans = qk === 2 ? ppl[0] : qk === 3 ? ppl[n - 1] : ppl[1];
      S.innerHTML = shuffle(facts).map(f => tr(`・${f}`, `・${f}`)).join("<br>");
      Q.textContent = tr(`${at[qk]}のは？`, `Who is ${at[qk]}?`);
      O.innerHTML = btnRow(shuffle(ppl.slice()).map(p => [p, p + tr("さん", ""), "font-size:20px;padding:12px 4px"]));
    }
    const t = timed(c, 90, tr("問", " solved"), () => score);
    c.on(O, "pointerdown", e => {
      const b = e.target.closest("[data-v]"); if (!b) return; e.preventDefault();
      if (b.dataset.v === ans) { score++; c.sfx.ok(score % 12); } else { t.penalty(5); c.sfx.ng(); c.shake(); c.pop(tr(`正解は${ans}さん`, `Answer: ${ans}`), SC.accent); }
      make();
    });
    make();
  },
});

/* ---------- 08 2バック ---------- */
game({
  id: "nback", name: tr("2バック", "2-Back"), glyph: "二", color: "#d6b98c",
  how: tr("文字が1つずつ表示されるよ。「2つ前と同じ文字」が出たら一致ボタン。脳のワーキングメモリを鍛える定番トレーニング。30問。", "Letters appear one at a time. Press Match when the letter is the same as the one two steps back. A classic working-memory workout. 30 letters."),
  fmt: s => s.toFixed(0) + "%",
  ranks: [[97, tr("超集中", "Laser focus")], [90, tr("記憶エンジン", "Memory engine")], [82, tr("かなり強い", "Very strong")], [74, tr("いい調子", "Doing well")], [65, tr("ふつう", "Average")], [0, tr("メモリ不足", "Out of memory")]],
  play(c) {
    const L = [tr("カ", "K"), tr("キ", "H"), tr("ク", "T"), tr("ケ", "R"), tr("コ", "S"), tr("サ", "N")], TOT = 30;
    const seq = [];
    for (let i = 0; i < TOT; i++) seq.push(i >= 2 && Math.random() < .33 ? seq[i - 2] : pick(L.filter(x => i < 2 || x !== seq[i - 2])));
    let i = -1, pressed = false, right = 0, judged = 0;
    const box = panel(c, tr(`<p class="hint">2つ前と同じなら「一致」</p>
      <div data-l style="font-family:${BRAND.fd};font-size:clamp(90px,30vw,140px);font-weight:800;line-height:1;min-height:1.1em"></div>
      <button class="btn" type="button" data-v="m" style="width:100%;justify-content:center;font-size:22px;padding:18px">一致</button>`, `<p class="hint">Same as two back? Press Match</p>
      <div data-l style="font-family:${BRAND.fd};font-size:clamp(90px,30vw,140px);font-weight:800;line-height:1;min-height:1.1em"></div>
      <button class="btn" type="button" data-v="m" style="width:100%;justify-content:center;font-size:22px;padding:18px">Match</button>`));
    const Lb = box.querySelector("[data-l]"), Bt = box.querySelector("[data-v]");
    const isMatch = k => k >= 2 && seq[k] === seq[k - 2];
    const upd = () => c.hud(`<b>${Math.max(0, i + 1)}</b> / ${TOT}`, judged ? tr(`正答率 <b>${Math.round(right / judged * 100)}</b>%`, `Accuracy <b>${Math.round(right / judged * 100)}</b>%`) : "");
    function judge() { if (i < 2) return; judged++; if (pressed === isMatch(i)) right++; else if (!pressed) c.pop(tr("見逃し", "Missed"), SC.accent); upd(); }
    function step() {
      if (i >= 0) judge();
      i++; if (i >= TOT) { c.end(Math.round(right / judged * 100)); return; }
      pressed = false; Bt.style.background = ""; Lb.textContent = seq[i]; upd();
      c.after(1300, () => Lb.textContent = ""); c.after(2000, step);
    }
    c.on(Bt, "pointerdown", e => {
      e.preventDefault(); if (pressed || i < 0) return; pressed = true;
      if (isMatch(i)) { c.sfx.ok(4); Bt.style.background = "#b7d9b1"; } else { c.sfx.ng(); Bt.style.background = "#f0b5a8"; }
    });
    upd(); c.after(600, step);
  },
});

/* ---------- 09 図形回転 ---------- */
game({
  id: "rotate", name: tr("図形回転", "Rotate or Mirror"), glyph: "回", color: "#b3c7e6",
  how: tr("右の図形は、左を回転させただけ？それとも裏返し（鏡像）？頭の中で回して答えよう。まちがえると5秒マイナス。60秒。", "Is the right shape just the left one rotated, or is it flipped (a mirror image)? Rotate it in your head. A wrong answer costs 5 seconds. 60 seconds."),
  fmt: s => s + tr("問", " solved"),
  ranks: [[22, tr("空間認識の鬼", "Spatial genius")], [16, tr("設計士の頭", "Architect's mind")], [12, tr("鋭い", "Sharp")], [8, tr("いい調子", "Doing well")], [4, tr("ふつう", "Average")], [0, tr("目が回る", "Getting dizzy")]],
  play(c) {
    const { x, W, H } = c.canvas();
    let score = 0, A = [], Bp = [], mirror = false, rot = 0;
    const norm = P => { const mx = Math.min(...P.map(p => p[0])), my = Math.min(...P.map(p => p[1])); return P.map(([a, b]) => [a - mx, b - my]).sort((u, v) => u[0] - v[0] || u[1] - v[1]); };
    const key = P => norm(P).map(p => p.join(",")).join(";");
    const r90 = P => P.map(([a, b]) => [-b, a]);
    const mir = P => P.map(([a, b]) => [-a, b]);
    function shape() {
      const n = score < 6 ? 5 : 6;
      for (; ;) {
        const P = [[0, 0]];
        while (P.length < n) { const [a, b] = pick(P), d = pick([[1, 0], [-1, 0], [0, 1], [0, -1]]); const q = [a + d[0], b + d[1]]; if (!P.some(p => p[0] === q[0] && p[1] === q[1])) P.push(q); }
        const rots = [P, r90(P), r90(r90(P)), r90(r90(r90(P)))].map(key);
        if (!rots.includes(key(mir(P)))) return P; // 鏡像が回転で作れない形だけ使う
      }
    }
    function make() {
      A = shape(); mirror = Math.random() < .5; rot = ri(1, 3);
      let P = mirror ? mir(A) : A; for (let k = 0; k < rot; k++) P = r90(P); Bp = norm(P); A = norm(A);
    }
    const t = timed(c, 60, tr("問", " solved"), () => score);
    const ansBtn = c.el(tr(`<div class="row2" style="position:absolute;left:16px;right:16px;bottom:16px;width:auto">${btnRow([["0", "回転"], ["1", "鏡像"]])}</div>`, `<div class="row2" style="position:absolute;left:16px;right:16px;bottom:16px;width:auto">${btnRow([["0", "Rotated"], ["1", "Mirrored"]])}</div>`));
    c.on(ansBtn, "pointerdown", e => {
      const b = e.target.closest("[data-v]"); if (!b) return; e.preventDefault();
      if ((b.dataset.v === "1") === mirror) { score++; c.sfx.ok(score % 12); } else { t.penalty(5); c.sfx.ng(); c.shake(); c.pop(mirror ? tr("正解は鏡像", "It was mirrored") : tr("正解は回転", "It was rotated"), SC.accent); }
      make();
    });
    make();
    c.loop(() => {
      x.fillStyle = SC.bg; x.fillRect(0, 0, W, H);
      const cell = Math.min((W / 2 - 28) / 4, (H - 200) / 4.5, 48);
      const drawP = (P, cx, cy, col) => {
        const mx = Math.max(...P.map(p => p[0])) + 1, my = Math.max(...P.map(p => p[1])) + 1;
        const ox = cx - mx * cell / 2, oy = cy - my * cell / 2;
        P.forEach(([a, b]) => { x.fillStyle = col; x.fillRect(ox + a * cell, oy + b * cell, cell, cell); x.strokeStyle = SC.ink; x.lineWidth = 1.5; x.strokeRect(ox + a * cell, oy + b * cell, cell, cell); });
      };
      const cy = (H - 90) / 2;
      drawP(A, W * .25, cy, "#b3c7e6"); drawP(Bp, W * .75, cy, "#e9c46a");
      x.strokeStyle = "rgba(31,42,58,.2)"; x.beginPath(); x.moveTo(W / 2, 30); x.lineTo(W / 2, H - 110); x.stroke();
      x.fillStyle = SC.muted; x.font = `700 14px ${BRAND.fb}`; x.textAlign = "center"; x.fillText(tr("もとの形", "Original"), W * .25, 28); x.fillText(tr("これは？", "This one?"), W * .75, 28);
    });
  },
});

/* ---------- 10 マインスイーパー ---------- */
game({
  id: "mines", name: tr("マインスイーパー", "Minesweeper"), glyph: "雷", color: "#d4a5a5", lower: true,
  how: tr("数字は周りの8マスにある地雷の数。地雷以外を全部開けよう。旗ボタンで旗モード、長押しでも旗が立つよ。9×9・地雷10個。", "Numbers show how many mines touch that cell. Open every cell without a mine. Use the flag button or long-press to place a flag. 9×9 with 10 mines."),
  fmt: s => s >= 9999 ? tr("爆発", "Boom") : sec(s),
  ranks: [[30, tr("伝説の掃除屋", "Legendary sweeper")], [60, tr("上級者", "Expert")], [100, tr("中級者", "Intermediate")], [160, tr("いい調子", "Doing well")], [300, tr("慎重派", "Careful")], [99999, tr("爆発", "Boom")]],
  play(c) {
    const N = 9, M = 10; let mine = null, open = Array(N * N).fill(false), flag = Array(N * N).fill(false), flagMode = false, over = false, t0 = 0, started = false;
    const nbr = i => { const r = Math.floor(i / N), k = i % N, o = []; for (let dr = -1; dr <= 1; dr++) for (let dk = -1; dk <= 1; dk++) { if (!dr && !dk) continue; const rr = r + dr, kk = k + dk; if (rr >= 0 && kk >= 0 && rr < N && kk < N) o.push(rr * N + kk); } return o; };
    const cnt = i => nbr(i).filter(j => mine[j]).length;
    const box = panel(c, tr(`<div class="grid" data-g style="position:relative;left:auto;top:auto;transform:none;width:min(100%,calc(var(--sh) - 90px));grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:2px"></div>
      <button class="btn sub" type="button" data-f style="width:100%;justify-content:center">旗モード：オフ</button>`, `<div class="grid" data-g style="position:relative;left:auto;top:auto;transform:none;width:min(100%,calc(var(--sh) - 90px));grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:2px"></div>
      <button class="btn sub" type="button" data-f style="width:100%;justify-content:center">Flag mode: off</button>`));
    const G = box.querySelector("[data-g]"), F = box.querySelector("[data-f]");
    const COL = ["", "#2f6db0", "#3f7d58", "#c4452f", "#5b3f8c", "#8a3b1d", "#2a7a7a", "#1f2a3a", "#6b6457"];
    const time = () => started ? (performance.now() - t0) / 1000 : 0;
    c.loop(() => c.hud(tr(`旗 <b>${flag.filter(Boolean).length}</b> / ${M}`, `Flags <b>${flag.filter(Boolean).length}</b> / ${M}`), tr(`<b>${time().toFixed(1)}</b> 秒`, `<b>${time().toFixed(1)}</b> s`)));
    function place(safe) {
      mine = Array(N * N).fill(false); const ban = new Set([safe, ...nbr(safe)]);
      shuffle([...Array(N * N).keys()].filter(i => !ban.has(i))).slice(0, M).forEach(i => mine[i] = true);
    }
    function reveal(i) { if (open[i] || flag[i]) return; open[i] = true; if (!mine[i] && cnt(i) === 0) nbr(i).forEach(reveal); }
    function draw() {
      G.innerHTML = open.map((o, i) => {
        if (!o) return tr(`<button type="button" data-i="${i}" style="all:unset;cursor:pointer;background:#d9cfbb;border:1px solid rgba(31,42,58,.35);border-radius:3px;display:grid;place-items:center;font-weight:800;color:${SC.accent};font-size:clamp(12px,3.6vw,18px)">${flag[i] ? "旗" : over && mine[i] ? "●" : ""}</button>`, `<button type="button" data-i="${i}" style="all:unset;cursor:pointer;background:#d9cfbb;border:1px solid rgba(31,42,58,.35);border-radius:3px;display:grid;place-items:center;font-weight:800;color:${SC.accent};font-size:clamp(12px,3.6vw,18px)">${flag[i] ? "⚑" : over && mine[i] ? "●" : ""}</button>`);
        if (mine[i]) return `<span style="background:${SC.accent};border-radius:3px;display:grid;place-items:center;color:#fff;font-weight:800">●</span>`;
        const n = cnt(i); return `<span style="background:${SC.bg};border:1px solid rgba(31,42,58,.12);border-radius:3px;display:grid;place-items:center;font-family:${MONO};font-weight:600;color:${COL[n]};font-size:clamp(12px,3.8vw,19px)">${n || ""}</span>`;
      }).join("");
    }
    let pressT = 0, pressI = -1, longDone = false;
    const act = (i, asFlag) => {
      if (over || open[i]) return;
      if (asFlag) { flag[i] = !flag[i]; c.sfx.tick(); draw(); return; }
      if (flag[i]) return;
      if (!started) { started = true; t0 = performance.now(); place(i); }
      if (mine[i]) { over = true; open[i] = true; draw(); c.sfx.ng(); c.shake(); c.after(1200, () => c.end(9999)); return; }
      reveal(i); c.sfx.tick(); draw();
      if (open.filter((o, k) => !o && !mine[k]).length === 0 && mine) { over = true; c.end(Math.round(time() * 10) / 10); }
    };
    c.on(G, "pointerdown", e => { const b = e.target.closest("[data-i]"); if (!b) return; e.preventDefault(); pressI = +b.dataset.i; pressT = performance.now(); longDone = false; });
    c.every(80, () => { if (pressI >= 0 && !longDone && performance.now() - pressT > 450) { longDone = true; act(pressI, true); buzz(20); } });
    c.on(window, "pointerup", () => { if (pressI < 0) return; const i = pressI; pressI = -1; if (!longDone) act(i, flagMode); });
    c.on(G, "contextmenu", e => e.preventDefault());
    c.on(F, "click", () => { flagMode = !flagMode; F.textContent = tr(`旗モード：${flagMode ? "オン" : "オフ"}`, `Flag mode: ${flagMode ? "on" : "off"}`); F.style.background = flagMode ? "#f0d2a8" : ""; });
    draw();
  },
});

boot();
window.go = go; window.GAMES = GAMES; Object.defineProperty(window, "ctx", { get: () => ctx }); Object.defineProperty(window, "cur", { get: () => cur });
});
</script>
